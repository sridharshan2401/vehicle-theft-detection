[project]
name = "vehicle-theft-detection"
version = "0.1.0"
description = "Prototype that analyses prerecorded parking videos for suspicious vehicle interactions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }  # GNU AGPL-3.0, required by the Ultralytics YOLO dependency

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
